<div id="pract-root" data-pract-root><script>
(() => {
    'use strict';
    // The tile lives in a shadow root so that it works as a normal tile (type 1)
    // and as a fullscreen-capable tile (type 2) without touching the host page.
    const host = document.currentScript?.closest('[data-pract-root]') || document.getElementById('pract-root');
    const ui = host.attachShadow({mode: 'open'});
    ui.innerHTML = `<style>
        :host { display: block; box-sizing: border-box; margin: 0; overflow: hidden; min-width: 0; min-height: 0; }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        .pa {
            --accent: var(--accent-color, #3b82f6);
            height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: var(--msg-gap, 8px); padding: 4px; color: var(--content-color, inherit);
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        .message {
            flex: 0 0 auto; width: 100%; text-align: center; line-height: 1.25;
            font-size: var(--msg-font, 18px); overflow: hidden; overflow-wrap: anywhere;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--msg-lines, 1);
            min-height: calc(var(--msg-font, 18px) * 1.25);
        }
        .keypad {
            display: grid; grid-template-columns: repeat(3, var(--cw, 56px)); grid-auto-rows: var(--ch, 56px);
            gap: var(--gap, 8px); justify-content: center;
        }
        .key {
            width: var(--cw, 56px); height: var(--ch, 56px); margin: 0; padding: 0;
            display: flex; align-items: center; justify-content: center;
            font: inherit; font-size: var(--digit-font, 22px); line-height: 1; color: inherit;
            cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
            transition: transform 0.08s, background-color 0.08s;
        }
        .key:active:not(:disabled) { transform: scale(0.94); }
        .key:disabled { opacity: 0.3; cursor: default; }
        .command { font-size: var(--command-font, 13px); font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }

        .round .key {
            border-radius: 50%; border: 1.5px solid color-mix(in srgb, currentColor 28%, transparent);
            background: transparent; font-weight: 300;
        }
        .round .key:active:not(:disabled) { background: color-mix(in srgb, currentColor 14%, transparent); }
        .round .command { border-color: transparent; }
        .round .enter { color: var(--accent); }

        .pills .key {
            border: 0; border-radius: calc(var(--ch, 56px) / 2);
            background: color-mix(in srgb, currentColor 10%, transparent); font-weight: 400;
        }
        .pills .key:active:not(:disabled) { background: color-mix(in srgb, currentColor 20%, transparent); }
        .pills .enter, .pills .enter:active:not(:disabled) { background: var(--accent); color: #fff; }

        .tiles .key {
            border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
            border-radius: max(4px, calc(var(--ch, 56px) * 0.12));
            background: color-mix(in srgb, currentColor 6%, transparent); font-weight: 500;
        }
        .tiles .key:active:not(:disabled) { background: color-mix(in srgb, currentColor 16%, transparent); }
        .tiles .enter, .tiles .enter:active:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }

        .pattern-pad {
            display: block; flex: 0 0 auto; width: var(--pattern, 240px); height: var(--pattern, 240px);
            touch-action: none;
        }
        .pattern-point { fill: currentColor; opacity: 0.45; transition: r 0.1s, opacity 0.1s; }
        .pattern-point.hit { fill: var(--accent); opacity: 1; }
        .pattern-links line { stroke: var(--accent); stroke-width: 11; stroke-linecap: round; opacity: 0.85; }
        .pattern-live { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; opacity: 0.45; }
        .pattern-trail path { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; }
    </style>
    <div class="pa tiles">
        <div class="message" role="status"></div>
        <section class="keypad">
            <button class="key digit" data-digit="7">7</button>
            <button class="key digit" data-digit="8">8</button>
            <button class="key digit" data-digit="9">9</button>
            <button class="key digit" data-digit="4">4</button>
            <button class="key digit" data-digit="5">5</button>
            <button class="key digit" data-digit="6">6</button>
            <button class="key digit" data-digit="1">1</button>
            <button class="key digit" data-digit="2">2</button>
            <button class="key digit" data-digit="3">3</button>
            <button class="key command clear"></button>
            <button class="key digit" data-digit="0">0</button>
            <button class="key command enter"></button>
        </section>
        <svg class="pattern-pad" viewBox="0 0 360 360" role="img" hidden>
            <g class="pattern-links"></g>
            <line class="pattern-live" hidden></line>
            <g class="pattern-trail"></g>
            <g class="pattern-points"></g>
        </svg>
    </div>`;

    const root = ui.querySelector('.pa');
    const messageElement = ui.querySelector('.message');
    const keypad = ui.querySelector('.keypad');
    const clearKey = ui.querySelector('.clear');
    const enterKey = ui.querySelector('.enter');
    const patternPad = ui.querySelector('.pattern-pad');
    const patternLinks = ui.querySelector('.pattern-links');
    const patternLive = ui.querySelector('.pattern-live');
    const patternTrail = ui.querySelector('.pattern-trail');
    const patternPointGroup = ui.querySelector('.pattern-points');

    const messageTexts = {
        READY: 'Enter PIN',
        INPUT_ACTIVE: 'PIN entry in progress',
        PIN_INVALID: 'PIN invalid',
        ACTION_EXECUTED: 'Action executed',
        ACTION_FAILED: 'Action failed',
        TEMPORARILY_LOCKED: 'Temporarily locked',
        PERMANENTLY_LOCKED: 'Permanently locked',
        RECOVERY_ACTIVE: 'Enter Super PIN',
        SUPER_PIN_INVALID: 'Super PIN invalid',
        UNLOCKED: 'Unlocked',
        VISUALIZATION_REQUIRED: 'Use the built-in input tile',
        REREGISTRATION_REQUIRED: 'Re-registration required'
    };
    const keypadStyles = ['round', 'pills', 'tiles'];
    // Key cell proportions relative to the base size, maximum base size and gap ratio per style.
    const keypadGeometry = {
        round: {width: 1, height: 1, maximum: 104, gap: 0.2},
        pills: {width: 1.45, height: 0.78, maximum: 92, gap: 0.14},
        tiles: {width: 1.4, height: 0.82, maximum: 92, gap: 0.12}
    };
    const MAXIMUM_PATTERN_SIZE = 520;

    let tileState = {
        Message: 'READY', InputActive: false, Locked: false, LockUntil: 0,
        ServerTime: 0, receivedAt: Date.now(), MessageDuration: 3, Scramble: false, ScrambleInterval: 0,
        InputMode: 0, RecoveryMode: false, MinimumPatternLength: 2, MaximumPatternLength: 16, InputTimeout: 20,
        ContentMargins: false, KeypadStyle: 2, KeyLabels: 0, PatternTrail: 0
    };
    let initialized = false;
    let scrambleTimer = null;
    let refreshRequested = false;
    let pendingNavigationRequest = null;
    let pendingNavigationTimer = null;
    // The PIN is collected on this client only and submitted as one packet.
    let entry = '';
    let entryTimer = null;
    // Result and script output of this client's own request, shown instead of the status message.
    let lastRequestID = null;
    let resultMessage = '';
    let resultTimer = null;
    let outputText = '';
    let outputTimer = null;

    function localize(text) {
        return typeof translate === 'function' ? translate(text) : text;
    }

    // Symcon supplies the content margins of a normal tile (type 1), whose frame also covers
    // the title. A fullscreen-capable tile (type 2) already starts below the title.
    function applyContentBounds() {
        if (!tileState.ContentMargins) {
            host.style.padding = '0';
            return;
        }
        const parameters = new URLSearchParams(window.location.search);
        const number = (name) => {
            const value = Number.parseFloat(parameters.get(name) ?? '0');
            return Number.isFinite(value) ? Math.max(0, value) : 0;
        };
        const side = number('marginside');
        host.style.padding = `${number('margintop')}px ${side}px ${number('marginbottom')}px ${side}px`;
    }

    // Fill the visible space below the tile's top edge, never more than the parent offers.
    function fit() {
        const parent = host.parentElement;
        if (!parent) return;
        const viewport = window.visualViewport;
        const viewportBottom = Math.min(document.documentElement.clientHeight || window.innerHeight,
            viewport ? viewport.offsetTop + viewport.height : window.innerHeight);
        const inBody = parent === document.body || parent === document.documentElement;
        const bottomMargin = inBody ? Number.parseFloat(getComputedStyle(document.body).marginBottom) || 0 : 0;
        const space = Math.max(0, viewportBottom - Math.max(0, host.getBoundingClientRect().top) - bottomMargin);
        host.style.height = Math.floor(inBody ? space : Math.min(space, parent.clientHeight)) + 'px';
    }

    function clamp(value, minimum, maximum) {
        return Math.min(maximum, Math.max(minimum, value));
    }

    function messageLines() {
        return outputText !== '' && entry === '' && !tileState.Locked ? 3 : 1;
    }

    function layout() {
        const width = root.clientWidth - 8;
        const height = root.clientHeight - 8;
        if (width <= 0 || height <= 0) return;
        const lines = messageLines();
        if (isPatternMode()) {
            const estimate = Math.min(width, height, MAXIMUM_PATTERN_SIZE);
            const font = clamp(estimate * 0.06, 13, 28);
            const gap = clamp(font * 0.6, 4, 16);
            const size = Math.max(0, Math.min(width, height - font * 1.25 * lines - gap, MAXIMUM_PATTERN_SIZE));
            setVariables({'--pattern': size, '--msg-font': font, '--msg-gap': gap});
        } else {
            const style = keypadStyles[Number(tileState.KeypadStyle)] || 'tiles';
            const geometry = keypadGeometry[style];
            const base = (availableHeight) => Math.min(
                width / (3 * geometry.width + 2 * geometry.gap),
                availableHeight / (4 * geometry.height + 3 * geometry.gap),
                geometry.maximum
            );
            const font = clamp(base(height) * 0.26, 13, 28);
            const messageGap = clamp(font * 0.6, 4, 18);
            const keypadHeight = height - font * 1.25 * lines - messageGap;
            const size = Math.max(0, base(keypadHeight));
            const cellWidth = size * geometry.width;
            // Flat keys may grow up to 35 % taller when a narrow tile leaves vertical space.
            const rowSpace = (keypadHeight - 3 * size * geometry.gap) / 4;
            const cellHeight = style === 'round'
                ? size
                : clamp(rowSpace, size * geometry.height, size * geometry.height * 1.35);
            const digitFont = style === 'round' ? size * 0.4 : Math.min(cellHeight * 0.48, cellWidth * 0.36);
            const longest = Math.max(clearKey.textContent.length, enterKey.textContent.length, 2);
            setVariables({
                '--cw': cellWidth, '--ch': cellHeight, '--gap': size * geometry.gap,
                '--digit-font': digitFont,
                '--command-font': clamp(Math.min(digitFont * 0.45, cellWidth * 0.9 / (longest * 0.7)), 9, 22),
                '--msg-font': font, '--msg-gap': messageGap
            });
        }
        root.style.setProperty('--msg-lines', String(lines));
    }

    function setVariables(variables) {
        for (const [name, value] of Object.entries(variables)) {
            root.style.setProperty(name, `${Math.floor(value * 10) / 10}px`);
        }
    }

    function applyPresentation() {
        const style = keypadStyles[Number(tileState.KeypadStyle)] || 'tiles';
        root.classList.remove(...keypadStyles);
        root.classList.add(style);
        const labels = Number(tileState.KeyLabels) === 1
            ? [localize('CLEAR'), 'OK']
            : ['CLEAR', 'ENTER'];
        clearKey.textContent = labels[0];
        enterKey.textContent = labels[1];
        keypad.setAttribute('aria-label', localize('PIN keypad'));
        patternPad.setAttribute('aria-label', localize('Pattern input: hold, draw, then release'));
    }

    function isPatternMode() {
        return Number(tileState.InputMode) === 1 && !tileState.RecoveryMode;
    }

    window.handleMessage = function (data) {
        const update = typeof data === 'string' ? JSON.parse(data) : data;
        if (update.Navigation) {
            handleNavigation(update.Navigation);
            return;
        }
        if (update.Output) {
            handleOutput(update.Output);
            return;
        }
        if (update.Result) {
            handleResult(update.Result);
            return;
        }
        const wasPatternMode = isPatternMode();
        tileState = Object.assign(tileState, update, {receivedAt: Date.now()});
        refreshRequested = false;
        if (tileState.Locked || wasPatternMode !== isPatternMode()) {
            cancelPattern();
            resetEntry();
            resultMessage = '';
            outputText = '';
        }
        applyContentBounds();
        applyPresentation();
        fit();
        keypad.hidden = isPatternMode();
        patternPad.toggleAttribute('hidden', !isPatternMode());
        patternPad.setAttribute('aria-disabled', String(Boolean(tileState.Locked)));
        ui.querySelectorAll('.key').forEach((button) => button.disabled = Boolean(tileState.Locked));
        configureScrambleTimer();
        if (!initialized) scrambleDigits();
        initialized = true;
        renderMessage();
    };

    function resetEntry() {
        entry = '';
        if (entryTimer !== null) clearTimeout(entryTimer);
        entryTimer = null;
    }

    function finishEntry() {
        resetEntry();
        scrambleDigits();
        renderMessage();
    }

    function inputDigit(digit) {
        if (tileState.Locked || isPatternMode() || entry.length >= Number(tileState.MaximumPatternLength)) return;
        if (outputText !== '') clearOutput();
        if (resultMessage !== '') clearResult();
        entry += digit;
        if (entryTimer !== null) clearTimeout(entryTimer);
        entryTimer = setTimeout(finishEntry, Math.max(5, Number(tileState.InputTimeout)) * 1000);
        renderMessage();
    }

    function enter() {
        // An empty ENTER is ignored and never counts as a failed attempt.
        if (entry === '' || tileState.Locked) return;
        const code = entry;
        finishEntry();
        submitCode(code);
    }

    ui.querySelectorAll('.digit').forEach((button) => {
        button.addEventListener('click', () => inputDigit(button.dataset.digit));
    });
    clearKey.addEventListener('click', finishEntry);
    enterKey.addEventListener('click', enter);

    // Physical keyboard: digits, Enter, and Escape/Delete/Backspace to clear the whole entry.
    document.addEventListener('keydown', (event) => {
        if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || isPatternMode()) return;
        const target = event.composedPath()[0];
        if (target instanceof HTMLElement &&
            (target.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName))) return;
        if (!host.isConnected || host.getClientRects().length === 0) return;
        if (/^[0-9]$/.test(event.key)) {
            inputDigit(event.key);
        } else if (event.key === 'Enter') {
            enter();
        } else if (['Escape', 'Delete', 'Backspace'].includes(event.key)) {
            finishEntry();
        } else {
            return;
        }
        event.preventDefault();
    });

    function createRequestID() {
        if (crypto.randomUUID) return crypto.randomUUID();
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
    }

    function beginClientRequest() {
        pendingNavigationRequest = createRequestID();
        lastRequestID = pendingNavigationRequest;
        if (pendingNavigationTimer !== null) clearTimeout(pendingNavigationTimer);
        pendingNavigationTimer = setTimeout(() => {
            pendingNavigationRequest = null;
            pendingNavigationTimer = null;
        }, 30000);
        return pendingNavigationRequest;
    }

    function submitCode(code) {
        requestAction('Submit', JSON.stringify({Code: code, RequestID: beginClientRequest()}));
    }

    function claimRequest(requestID) {
        if (!pendingNavigationRequest || requestID !== pendingNavigationRequest) return false;
        pendingNavigationRequest = null;
        if (pendingNavigationTimer !== null) clearTimeout(pendingNavigationTimer);
        pendingNavigationTimer = null;
        return true;
    }

    function handleNavigation(navigation) {
        if (!claimRequest(navigation.RequestID)) return;
        const objectID = Number(navigation.ObjectID);
        if (Number.isInteger(objectID) && objectID > 0) openObject(objectID);
    }

    function handleOutput(output) {
        if (!claimRequest(output.RequestID) || typeof output.Text !== 'string') return;
        outputText = output.Text;
        if (outputTimer !== null) clearTimeout(outputTimer);
        outputTimer = setTimeout(clearOutput, Math.max(5, Number(tileState.MessageDuration)) * 1000);
        renderMessage();
    }

    function handleResult(result) {
        if (!lastRequestID || result.RequestID !== lastRequestID || typeof result.Message !== 'string') return;
        resultMessage = result.Message;
        if (resultTimer !== null) clearTimeout(resultTimer);
        resultTimer = setTimeout(clearResult, Math.max(1, Number(tileState.MessageDuration)) * 1000);
        renderMessage();
    }

    function clearResult() {
        resultMessage = '';
        if (resultTimer !== null) clearTimeout(resultTimer);
        resultTimer = null;
        renderMessage();
    }

    function clearOutput() {
        outputText = '';
        if (outputTimer !== null) clearTimeout(outputTimer);
        outputTimer = null;
        renderMessage();
    }

    function renderMessage() {
        layout();
        // Priority: own input, lock states, own script output, own result, shared status.
        if (outputText !== '' && entry === '' && !tileState.Locked) {
            messageElement.innerText = outputText;
            return;
        }
        let message = tileState.Message;
        if (entry !== '') message = 'INPUT_ACTIVE';
        else if (resultMessage !== '' && !tileState.Locked) message = resultMessage;
        let text = messageTexts[message] || message || '';
        if (isPatternMode()) {
            if (message === 'READY') text = 'Draw pattern';
            if (message === 'INPUT_ACTIVE') text = 'Pattern entry in progress';
            if (message === 'PIN_INVALID') text = 'Pattern invalid';
        }
        messageElement.innerText = localize(text);
        updateCountdown();
    }

    // Unbiased random index from the platform CSPRNG.
    function randomIndex(limit) {
        const range = Math.floor(0x100000000 / limit) * limit;
        const value = new Uint32Array(1);
        do {
            crypto.getRandomValues(value);
        } while (value[0] >= range);
        return value[0] % limit;
    }

    function scrambleDigits() {
        if (!tileState.Scramble || entry !== '' || isPatternMode()) return;
        const buttons = Array.from(ui.querySelectorAll('.digit'));
        const digits = buttons.map((button) => button.dataset.digit);
        for (let i = digits.length - 1; i > 0; i--) {
            const j = randomIndex(i + 1);
            [digits[i], digits[j]] = [digits[j], digits[i]];
        }
        buttons.forEach((button, index) => {
            button.dataset.digit = digits[index];
            button.textContent = digits[index];
        });
    }

    function configureScrambleTimer() {
        if (scrambleTimer !== null) clearInterval(scrambleTimer);
        scrambleTimer = null;
        if (!isPatternMode() && tileState.Scramble && tileState.ScrambleInterval > 0) {
            scrambleTimer = setInterval(scrambleDigits, tileState.ScrambleInterval * 1000);
        }
    }

    function updateCountdown() {
        if (!tileState.LockUntil || tileState.LockUntil <= tileState.ServerTime) return;
        const estimatedServerTime = tileState.ServerTime +
            Math.floor((Date.now() - tileState.receivedAt) / 1000);
        const remaining = Math.max(0, tileState.LockUntil - estimatedServerTime);
        if (remaining > 0) {
            messageElement.innerText = localize(messageTexts.TEMPORARILY_LOCKED) + ' (' + remaining + ' s)';
        } else if (!refreshRequested) {
            refreshRequested = true;
            requestAction('Refresh', true);
        }
    }

    // Pattern input
    const svgNS = 'http://www.w3.org/2000/svg';
    const POINT_RADIUS = 9;
    const HIT_RADIUS = 16;
    const CAPTURE_RADIUS = 30;
    const points = Array.from({length: 9}, (_, i) => ({
        number: String(i + 1), x: 60 + (i % 3) * 120, y: 60 + Math.floor(i / 3) * 120
    }));
    for (const point of points) {
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', point.x);
        circle.setAttribute('cy', point.y);
        circle.setAttribute('r', POINT_RADIUS);
        circle.setAttribute('class', 'pattern-point');
        patternPointGroup.append(circle);
        point.node = circle;
    }
    let patternPointer = null;
    let patternSequence = [];
    let patternPrevious = null;
    let patternOverflow = false;
    let patternTimeout = null;
    let captureLossTimer = null;
    let trailSegments = [];
    let trailFrame = null;

    function trailMode() {
        return [0, 1, 2].includes(Number(tileState.PatternTrail)) ? Number(tileState.PatternTrail) : 0;
    }

    function fadeTrail(now) {
        trailSegments = trailSegments.filter((segment) => {
            const opacity = 1 - (now - segment.time) / 700;
            if (opacity <= 0) {
                segment.node.remove();
                return false;
            }
            segment.node.setAttribute('opacity', opacity * 0.9);
            return true;
        });
        trailFrame = trailSegments.length ? requestAnimationFrame(fadeTrail) : null;
    }

    function clearTrail() {
        if (trailFrame !== null) cancelAnimationFrame(trailFrame);
        trailFrame = null;
        for (const segment of trailSegments) segment.node.remove();
        trailSegments = [];
        patternLinks.replaceChildren();
        patternLive.setAttribute('hidden', '');
        for (const point of points) {
            point.node.classList.remove('hit');
            point.node.setAttribute('r', POINT_RADIUS);
        }
    }

    function cancelPattern() {
        const capturedPointer = patternPointer;
        patternPointer = null;
        patternSequence = [];
        patternPrevious = null;
        patternOverflow = false;
        if (patternTimeout !== null) clearTimeout(patternTimeout);
        if (captureLossTimer !== null) clearTimeout(captureLossTimer);
        patternTimeout = null;
        captureLossTimer = null;
        clearTrail();
        if (capturedPointer !== null && patternPad.hasPointerCapture(capturedPointer)) {
            patternPad.releasePointerCapture(capturedPointer);
        }
    }

    function patternPosition(event) {
        // The pad may be letterboxed; use the actual SVG transform.
        const matrix = patternPad.getScreenCTM();
        if (!matrix) return null;
        const point = patternPad.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        return point.matrixTransform(matrix.inverse());
    }

    function appendPatternPoint(point) {
        const last = patternSequence[patternSequence.length - 1];
        if (last === point.number) return;
        if (patternSequence.length >= Number(tileState.MaximumPatternLength)) {
            patternOverflow = true;
            return;
        }
        patternSequence.push(point.number);
        if (trailMode() !== 0) return;
        point.node.classList.add('hit');
        point.node.setAttribute('r', HIT_RADIUS);
        if (last !== undefined) {
            const from = points[Number(last) - 1];
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', from.x);
            line.setAttribute('y1', from.y);
            line.setAttribute('x2', point.x);
            line.setAttribute('y2', point.y);
            patternLinks.append(line);
        }
    }

    function drawLiveLine(position) {
        const last = patternSequence[patternSequence.length - 1];
        if (trailMode() !== 0 || last === undefined) return;
        const from = points[Number(last) - 1];
        patternLive.setAttribute('x1', from.x);
        patternLive.setAttribute('y1', from.y);
        patternLive.setAttribute('x2', position.x);
        patternLive.setAttribute('y2', position.y);
        patternLive.removeAttribute('hidden');
    }

    function drawFadingSegment(from, to) {
        if (trailMode() !== 1) return;
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', `M${from.x},${from.y}L${to.x},${to.y}`);
        patternTrail.append(path);
        trailSegments.push({node: path, time: performance.now()});
        if (trailFrame === null) trailFrame = requestAnimationFrame(fadeTrail);
    }

    function samplePattern(position) {
        if (!position) return;
        if (patternPrevious === null) {
            const point = points.find((p) => Math.hypot(p.x - position.x, p.y - position.y) <= CAPTURE_RADIUS);
            if (point) appendPatternPoint(point);
        } else {
            const dx = position.x - patternPrevious.x;
            const dy = position.y - patternPrevious.y;
            const a = dx * dx + dy * dy;
            if (a > 0) {
                drawFadingSegment(patternPrevious, position);
                const hits = [];
                for (const point of points) {
                    const fx = patternPrevious.x - point.x;
                    const fy = patternPrevious.y - point.y;
                    const b = 2 * (fx * dx + fy * dy);
                    const c = fx * fx + fy * fy - CAPTURE_RADIUS * CAPTURE_RADIUS;
                    const discriminant = b * b - 4 * a * c;
                    if (discriminant < 0) continue;
                    const t0 = (-b - Math.sqrt(discriminant)) / (2 * a);
                    const t1 = (-b + Math.sqrt(discriminant)) / (2 * a);
                    if (t1 >= 0 && t0 <= 1) hits.push({point, t: Math.max(0, t0)});
                }
                hits.sort((first, second) => first.t - second.t);
                for (const hit of hits) appendPatternPoint(hit.point);
            }
        }
        drawLiveLine(position);
        patternPrevious = position;
    }

    function refreshPatternTimeout() {
        if (patternTimeout !== null) clearTimeout(patternTimeout);
        patternTimeout = setTimeout(() => {
            cancelPattern();
            renderMessage();
        }, Math.max(5, Number(tileState.InputTimeout)) * 1000);
    }

    patternPad.addEventListener('pointerdown', (event) => {
        if (!isPatternMode() || tileState.Locked || patternPointer !== null ||
            !event.isPrimary || (event.pointerType === 'mouse' && event.button !== 0)) return;
        event.preventDefault();
        cancelPattern();
        if (outputText !== '') clearOutput();
        if (resultMessage !== '') clearResult();
        patternPointer = event.pointerId;
        patternPad.setPointerCapture(event.pointerId);
        samplePattern(patternPosition(event));
        refreshPatternTimeout();
        messageElement.innerText = localize('Pattern entry in progress');
    });
    patternPad.addEventListener('pointermove', (event) => {
        if (event.pointerId !== patternPointer) return;
        event.preventDefault();
        const events = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
        for (const sample of events.length ? events : [event]) samplePattern(patternPosition(sample));
        refreshPatternTimeout();
    }, {passive: false});

    function finishPattern(event, cancelled) {
        if (patternPointer === null || event.pointerId !== patternPointer) return;
        if (!cancelled) samplePattern(patternPosition(event));
        // Retain no raw coordinates or point sequence after submission/cancellation.
        const pattern = patternOverflow ? '0' : patternSequence.join('');
        // A tap or a single point is not a pattern and never counts as a failed attempt.
        const complete = patternOverflow || patternSequence.length >= Number(tileState.MinimumPatternLength);
        cancelPattern();
        renderMessage();
        if (cancelled || !complete || tileState.Locked || !isPatternMode()) return;
        submitCode(pattern);
    }
    // Capture phase also receives pointerup if the pad has just lost pointer capture.
    window.addEventListener('pointerup', (event) => finishPattern(event, false), true);
    window.addEventListener('pointercancel', (event) => finishPattern(event, true), true);
    patternPad.addEventListener('lostpointercapture', (event) => {
        if (patternPointer === null || event.pointerId !== patternPointer) return;
        if (captureLossTimer !== null) clearTimeout(captureLossTimer);
        const pointer = event.pointerId;
        // Some macOS browsers deliver this shortly BEFORE pointerup. Only a real
        // pointerup can submit; loss of capture alone never confirms a gesture.
        captureLossTimer = setTimeout(() => {
            if (patternPointer === pointer) {
                cancelPattern();
                renderMessage();
            }
        }, 200);
    });
    for (const name of ['touchstart', 'touchmove', 'dragstart', 'selectstart']) {
        patternPad.addEventListener(name, (event) => event.preventDefault(), {passive: false});
    }
    window.addEventListener('blur', () => { cancelPattern(); renderMessage(); });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { cancelPattern(); renderMessage(); }
    });

    applyPresentation();
    const resizeObserver = new ResizeObserver(() => { fit(); layout(); });
    if (host.parentElement) resizeObserver.observe(host.parentElement);
    resizeObserver.observe(root);
    window.addEventListener('resize', fit);
    window.visualViewport?.addEventListener('resize', fit);
    fit();
    setInterval(updateCountdown, 250);
})();
</script></div>
